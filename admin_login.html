<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول الإدارة | بيئة العلوم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1a5f7a; --accent: #00d2ff; --dark: #0a2647; --bg: #f4f7f6; }
        
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border-top: 5px solid var(--primary);
        }

        .login-card h2 { color: var(--dark); margin-bottom: 10px; }
        .login-card p { color: #666; font-size: 0.9rem; margin-bottom: 30px; }

        .input-group { text-align: right; margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--dark); }
        
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-family: 'Cairo';
            box-sizing: border-box;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover { background: var(--dark); transform: translateY(-2px); }

        .back-link { display: block; margin-top: 20px; color: var(--primary); text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="login-card">
        <div style="font-size: 3rem; margin-bottom: 10px;">🔐</div>
        <h2>لوحة تحكم الباحثة</h2>
        <p>هذه الصفحة مخصصة للإدارة فقط</p>

        <div class="input-group">
            <label>اسم المستخدم</label>
            <input type="text" id="adminUser" placeholder="أدخل اسم المستخدم">
        </div>

        <div class="input-group">
            <label>كلمة المرور</label>
            <input type="password" id="adminPass" placeholder="••••••••">
        </div>

        <button class="login-btn" onclick="checkAdmin()">دخول لوحة التحكم</button>

        <a href="index.html" class="back-link">العودة للرئيسية</a>
    </div>

    <script>
        function checkAdmin() {
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;

            // الباسورد اللي اتفقنا عليه للباحثة سحر
            if (user === "sahar" && pass === "Sahar2026") {
                alert("أهلاً بكِ يا  سحر. جاري الانتقال للوحة التحكم...");
                window.location.href = "students.html"; // دي الصفحة اللي فيها أسماء الطلاب
            } else {
                alert("بيانات الدخول غير صحيحة، يرجى المحاولة مرة أخرى.");
            }
        }
    </script>

</body>
</html>
